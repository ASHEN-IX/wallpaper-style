<?xml version="1.0" encoding="UTF-8"?>
<!-- Wallpaper Style icon.

     A window frame carrying a colour swatch strip: the product's job in one
     picture - a desktop window whose appearance comes from the wallpaper.

     Drawn with flat shapes only so it rasterises cleanly at 16px, where a
     gradient would turn to mud. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3050"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="72" y="104" width="368" height="304" rx="28"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#backdrop)"/>

  <!-- Window frame -->
  <rect x="72" y="104" width="368" height="304" rx="28" fill="#1d2029"
        stroke="#3a4152" stroke-width="4"/>

  <!-- Title bar -->
  <g clip-path="url(#frameClip)">
    <rect x="72" y="104" width="368" height="52" fill="#252a36"/>
    <circle cx="108" cy="130" r="7" fill="#e26d6d"/>
    <circle cx="132" cy="130" r="7" fill="#e0a84e"/>
    <circle cx="156" cy="130" r="7" fill="#5cc98a"/>

    <!-- Wallpaper band: the palette the window was themed from -->
    <rect x="72" y="156" width="368" height="120" fill="#3b4a86"/>
    <rect x="72" y="156" width="368" height="120" fill="#7c8df0" opacity="0.45"/>
    <circle cx="330" cy="200" r="52" fill="#8395f0" opacity="0.55"/>
    <circle cx="150" cy="250" r="38" fill="#5f6fdd" opacity="0.35"/>

    <!-- Content rows -->
    <rect x="104" y="300" width="180" height="14" rx="7" fill="#e6e9ef"/>
    <rect x="104" y="328" width="250" height="10" rx="5" fill="#9aa3b2"/>
    <rect x="104" y="350" width="210" height="10" rx="5" fill="#6b7483"/>

    <!-- Accent button -->
    <rect x="104" y="374" width="96" height="26" rx="8" fill="#8395f0"/>
  </g>

  <!-- Swatch strip: the generated palette -->
  <g>
    <rect x="104" y="432" width="46" height="14" rx="7" fill="#8395f0"/>
    <rect x="160" y="432" width="46" height="14" rx="7" fill="#3ddc97"/>
    <rect x="216" y="432" width="46" height="14" rx="7" fill="#e0a84e"/>
    <rect x="272" y="432" width="46" height="14" rx="7" fill="#e26d6d"/>
    <rect x="328" y="432" width="46" height="14" rx="7" fill="#9aa3b2"/>
    <rect x="384" y="432" width="24" height="14" rx="7" fill="#e6e9ef"/>
  </g>
</svg>
