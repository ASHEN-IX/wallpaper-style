<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Wallpaper Style Dark palette preview">
  <defs>
    <!-- Everything inside the window frame is clipped to its rounded corners,
         so the sidebar cannot spill past the bottom edge. -->
    <clipPath id="windowBody">
      <rect width="640" height="400" rx="18"/>
    </clipPath>
  </defs>
  <!-- Generated by `wallpaper-style export-preview`. Shapes only, no text,
       so it renders identically everywhere. -->
  <rect width="640" height="400" rx="18" fill="#181a23"/>
  <g clip-path="url(#windowBody)">

  <!-- Title bar -->
  <rect x="0" y="0" width="640" height="42" rx="18" fill="#2c303d"/>
  <rect x="0" y="24" width="640" height="18" fill="#2c303d"/>
  <circle cx="28" cy="21" r="6" fill="#f66b71"/>
  <circle cx="48" cy="21" r="6" fill="#8395f0"/>
  <circle cx="68" cy="21" r="6" fill="#858689"/>
  <rect x="92" y="16" width="120" height="10" rx="5" fill="#f4f5f9" opacity="0.55"/>

  <!-- Sidebar -->
  <rect x="1" y="42" width="184" height="357" fill="#06070c"/>
  <rect x="16" y="64" width="152" height="28" rx="7" fill="#8395f0"/>
  <rect x="26" y="74" width="86" height="8" rx="4" fill="#06070a"/>
  <rect x="20" y="108" width="112" height="8" rx="4" fill="#f4f5f9" opacity="0.75"/>
  <rect x="20" y="132" width="132" height="8" rx="4" fill="#f4f5f9" opacity="0.75"/>
  <rect x="20" y="156" width="98" height="8" rx="4" fill="#f4f5f9" opacity="0.75"/>
  <rect x="20" y="180" width="120" height="8" rx="4" fill="#f4f5f9" opacity="0.75"/>

  <!-- Content: heading and body -->
  <rect x="212" y="72" width="216" height="14" rx="7" fill="#f4f5f9"/>
  <rect x="212" y="100" width="360" height="9" rx="4.5" fill="#858689"/>
  <rect x="212" y="118" width="330" height="9" rx="4.5" fill="#858689"/>
  <rect x="212" y="136" width="286" height="9" rx="4.5" fill="#858689"/>

  <!-- Buttons -->
  <rect x="212" y="168" width="118" height="36" rx="8" fill="#8395f0"/>
  <rect x="236" y="183" width="70" height="7" rx="3.5" fill="#06070a"/>
  <rect x="342" y="168" width="118" height="36" rx="8" fill="#424758"/>
  <rect x="366" y="183" width="70" height="7" rx="3.5" fill="#f4f5f9"/>

  <!-- A warning line -->
  <circle cx="220" cy="236" r="5" fill="#f66b71"/>
  <rect x="234" y="232" width="168" height="8" rx="4" fill="#f66b71"/>

  <!-- Palette strip: every promised colour -->
  <rect x="212" y="270" width="52" height="20" rx="5" fill="#8395f0"/>
  <rect x="272" y="270" width="52" height="20" rx="5" fill="#06070c" stroke="#858689" stroke-width="1"/>
  <rect x="332" y="270" width="52" height="20" rx="5" fill="#181a23" stroke="#858689" stroke-width="1"/>
  <rect x="392" y="270" width="52" height="20" rx="5" fill="#2c303d"/>
  <rect x="452" y="270" width="52" height="20" rx="5" fill="#424758"/>
  <rect x="512" y="270" width="52" height="20" rx="5" fill="#f4f5f9"/>
  <rect x="212" y="300" width="352" height="2" rx="1" fill="#858689" opacity="0.4"/>
  </g>

  <!-- Window outline, drawn last so the clipped content cannot cover it -->
  <rect x="0.5" y="0.5" width="639" height="399" rx="18" fill="none" stroke="#858689" stroke-opacity="0.35"/>
</svg>
