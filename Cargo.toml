[workspace]
resolver = "2"
members = [
    "crates/ws-palette",
    "crates/ws-core",
    "crates/ws-backend",
    "crates/ws-plasma",
    "crates/ws-service",
    "crates/ws-cli",
    "crates/ws-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Wallpaper Style contributors"]
repository = "https://example.invalid/wallpaper-style"

[workspace.dependencies]
ws-palette = { path = "crates/ws-palette" }
ws-core = { path = "crates/ws-core" }
ws-backend = { path = "crates/ws-backend" }
ws-plasma = { path = "crates/ws-plasma" }
ws-service = { path = "crates/ws-service" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep the debug profile fast but debuggable; palette sampling is CPU-bound and
# tests decode real images.
[profile.dev.package."*"]
opt-level = 2
